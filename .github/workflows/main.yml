name: Build Magisk Module

on:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Package Magisk Module ZIP
        run: |
          zip -r wifi_swap_module.zip module.prop service.sh system/ -x "*.git*"

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: wifi_swap_module
          path: wifi_swap_module.zip
          
